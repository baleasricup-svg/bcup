<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Baleasri Event</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F4C5C">
<meta name="background-color" content="#F7F9FB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baleasri">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Tutup menu">✕</button>
    <div class="brand">
      <div class="brand-logo" id="brand-logo">🏐</div>
      <div class="brand-text">
        <div class="eyebrow">Event Management</div>
        <h1>BALEASRI</h1>
      </div>
      <button class="sidebar-collapse-toggle" id="sidebar-collapse-toggle" type="button" title="Perkecil menu" aria-label="Perkecil menu">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- USER INFO -->
    <div class="user-info" id="user-info">
      <div class="name" id="user-name-display">
        <span id="user-icon">👤</span>
        <span id="user-name-text">Pengunjung</span>
      </div>
      <button class="btn-login" id="btn-login" onclick="openLoginModal()">Login</button>
      <button class="btn-logout" id="btn-logout" onclick="logout()" style="display:none;">Logout</button>
    </div>

    <nav class="nav nav-global" id="nav-global"></nav>
    <div class="event-block">
      <label>Turnamen Aktif</label>
      <select class="event-select" id="event-select"></select>
      <button class="btn-ghost-light" id="btn-new-event" type="button" style="display:none;">+ Turnamen Baru</button>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="left">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Menu">☰</button>
        <div>
          <h2 id="page-title">Dasbor</h2>
          <div class="sub" id="page-sub"></div>
        </div>
      </div>
      <div class="saldo-chip" id="saldo-chip" title="Jumlah pertandingan & tim di turnamen aktif">
        <span class="lbl" id="saldo-lbl">Progres</span>
        <span class="val mono" id="saldo-val">—</span>
      </div>
    </div>
    <div id="content"></div>
    <footer class="app-footer">
      <div class="app-footer-quote">&ldquo;Satukan tim, catat setiap pertandingan.&rdquo;</div>
    </footer>
  </main>
</div>

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Judul</h3>
      <button class="close-x" id="modal-close" type="button">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Modul dimuat berurutan (saling bergantung lewat variabel global, bukan ES module).
     Urutan HARUS: config → auth → navigation → dashboard → turnamen → tim →
     pertandingan → klasemen → pengaturan → init. -->
<script src="js/00-config.js" defer></script>
<script src="js/01-auth.js" defer></script>
<script src="js/02-navigation.js" defer></script>
<script src="js/03-dashboard.js" defer></script>
<script src="js/04-turnamen.js" defer></script>
<script src="js/05-tim.js" defer></script>
<script src="js/06-pertandingan.js" defer></script>
<script src="js/07-klasemen.js" defer></script>
<script src="js/08-pengaturan.js" defer></script>
<script src="js/09-init.js" defer></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.error('Gagal mendaftarkan service worker:', err);
      });
    });
  }
</script>
</body>
</html>
